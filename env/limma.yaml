# Differential abundance (limma), plots and enrichment (scripts/*.R)
name: limma
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base>=4.4
  - r-yaml
  - r-dplyr
  - r-tidyr
  - r-ggplot2
  - r-ggrepel
  - r-pheatmap
  - r-ggridges          # enrichplot::ridgeplot (suggested dependency)
  - r-gridextra         # enrichplot::gseaplot2(pvalue_table = TRUE) (suggested dependency)
  - bioconductor-limma
  - bioconductor-enhancedvolcano
  - bioconductor-clusterprofiler
  - bioconductor-enrichplot
  - bioconductor-dose
  - bioconductor-org.mm.eg.db
